# Bloque de reversa para el .htaccess de httpdocs en medicaldigitalperu.com.
# REEMPLAZA al bloque "Medical Digital Astro". Devuelve el sitio de WordPress sin borrar archivos:
# fuerza index.php en la raíz y en las carpetas que Astro creó. Ver wordpress/README.md.

# BEGIN Medical Digital Reversa
DirectoryIndex index.php index.html
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteRule ^(nosotros|contacto|marcas|productos|noticias|servicio-tecnico|terminos-y-condiciones|politicas-de-privacidad)(/.*)?$ /index.php [L]
</IfModule>
# END Medical Digital Reversa
