# Variante en nginx del bloque de Astro. SOLO se usa si el "Modo proxy" de Plesk está apagado
# (nginx sin Apache: el .htaccess no se lee). Con el modo proxy activo se usa htaccess-astro.conf.
#
# Se pega en Plesk → Sitios web y dominios → Configuración de Apache y nginx →
# "Directivas adicionales de nginx". Esas directivas quedan dentro del bloque server del dominio,
# por eso no se declara "location /" (Plesk ya lo define) ni "index".
#
# El orden de los archivos índice se fija en la misma pantalla, en "Archivos índice":
# index.html tiene que ir ANTES de index.php.
#
# Esta variante no se pudo probar contra el servidor: después de pegarla hay que recorrer
# la prueba de humo de wordpress/README.md.

# --- Parte previa: se pega ANTES del primer deploy. ---

# WordPress usa la raíz con estos parámetros; la raíz ahora es el index.html de Astro.
if ($args ~* "(^|&)(rest_route|p|page_id|preview)=") {
    rewrite ^/$ /index.php last;
}

# --- Parte definitiva: se pega DESPUÉS del primer deploy. ---
# REEMPLAZA a la regla de enlaces permanentes de WordPress que ya exista en este cuadro
# (normalmente: if (!-e $request_filename) { rewrite ^.*$ /index.php last; }).

error_page 404 /404.html;

rewrite ^/producto/([^/]+)/?$ /productos/$1/ permanent;
rewrite ^/categoria-producto/(?:.+/)?([^/]+)/?$ /productos/categoria/$1/ permanent;
rewrite ^/marca/([^/]+)/?$ /productos/?marca=$1 permanent;
rewrite ^/sitemap_index\.xml$ /sitemap-index.xml permanent;

# Solo las rutas de WordPress que no existen en disco van a index.php.
# El resto de lo que no existe responde el 404 de Astro, no el del tema.
set $medical_to_wordpress "";
if (!-e $request_filename) {
    set $medical_to_wordpress "missing";
}
if ($uri ~ "^/(wp-json|wp-admin|wp-content|wp-includes)(/|$)") {
    set $medical_to_wordpress "${medical_to_wordpress}+wordpress";
}
if ($medical_to_wordpress = "missing+wordpress") {
    rewrite ^ /index.php last;
}
